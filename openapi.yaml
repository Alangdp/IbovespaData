openapi: 3.1.0
info:
  title: API de Fundos Imobiliarios — IbovespaData
  version: 0.6.0
  description: |
    Rotas de FIIs do IbovespaData, baseadas no contrato `fii-api.yaml` do
    comparador de FIIs (modelo Pydantic `FundoFII`).

    Diferencas em relacao ao contrato original:
    - Toda resposta vem no envelope padrao do projeto `{ status, data, errors }`;
      o `data` segue o schema `Fundo`.
    - O schema `Fundo` ganhou campos extras (marcados como "Extra" na descricao)
      com dados que a fonte fornece e o contrato nao previa. Os campos do
      contrato original nao mudaram de nome nem de significado.
    - `gestora`, `taxa_administracao`, `limite_distribuicao_respeitado`,
      `diversificado` e `boa_localizacao` vem dos informes da CVM
      (dados.cvm.gov.br), atualizados por um job diario; ficam `null` para
      fundos sem o informe correspondente. Os limites das regras ficam em
      `src/config/fiiCriterios.ts`.
    - `gestora_confiavel` compara o CNPJ da gestora com a lista mantida em
      `data/gestoras-confiaveis.json` (`null` enquanto a lista estiver vazia).
    - So entram fundos de Tijolo, Papel, Hibrido e FoF; Fiagro e FI-Infra
      ficam de fora da listagem e respondem 422 no detalhe.

    Fontes: statusinvest.com.br (busca avancada de FIIs, pagina do fundo e
    proventos), dados abertos da CVM (informes mensal, trimestral e anual),
    relatorio gerencial no FNET (LTV e spread) e IBGE (municipios, populacao e
    regioes metropolitanas).
    Cache de 6h no Redis.
paths:
  /fundos:
    get:
      summary: Lista fundos imobiliarios
      operationId: listarFundos
      parameters:
      - name: tickers
        in: query
        required: false
        schema:
          type: string
        description: |
          Lista de tickers separados por virgula (ex: GGRC11,BTLG11,HGLG11).
          Omitido = todos os fundos disponiveis, numa listagem resumida em que
          dividendos_mensais, vacancia_fisica, num_imoveis, cnpj,
          administradora e area_total voltam vazios/null.
          Tickers invalidos sao apenas omitidos da lista.
      responses:
        '200':
          description: Lista de fundos
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Resposta'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Fundo'
  /fundos/regioes:
    get:
      summary: Classificacao das cidades por tipo de imovel
      description: |
        Base do `boa_localizacao`. Para cada tipo de imovel (segmento do
        statusinvest ou, sem ele, segmento de atuacao da CVM) e cidade dos
        imoveis de FII:
        1. `vacancia_tipo`: com ao menos 3 imoveis de renda prontos de 2
           fundos no mesmo tipo, a cidade e boa se a vacancia media for menor
           que a do mercado no tipo;
        2. `vacancia_cidade`: senao, a mesma comparacao com todos os tipos;
        3. `ibge`: senao, boa se o municipio for da regiao metropolitana de
           uma capital ou tiver ao menos 500 mil habitantes (Censo 2022).
        Fundos que informam vacancia e receita zeradas em todos os imoveis
        ficam fora das medias. A cidade vem do endereco em texto livre do
        informe trimestral.
      operationId: listarRegioes
      parameters:
      - name: tipo
        in: query
        required: false
        schema:
          type: string
        description: Logistica, Escritorios, Shoppings, Varejo, Residencial, Hospital, Hotel, Educacional ou Outros (ignora acentos)
      - name: uf
        in: query
        required: false
        schema:
          type: string
        example: SP
      - name: cidade
        in: query
        required: false
        schema:
          type: string
        description: Parte do nome (ignora acentos)
      responses:
        '200':
          description: Cidades classificadas
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Resposta'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Regiao'
  /gestoras:
    get:
      summary: Gestoras de FII, para montar a lista de confiaveis
      description: Gestoras do informe anual da CVM, da que gere mais fundos para a que gere menos. Copie o CNPJ para data/gestoras-confiaveis.json
      operationId: listarGestoras
      parameters:
      - name: busca
        in: query
        required: false
        schema:
          type: string
        description: Parte do nome ou do CNPJ (ignora acentos e pontuacao)
      responses:
        '200':
          description: Gestoras
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Resposta'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Gestora'
  /fundos/{ticker}/criterios:
    get:
      summary: Calculo de diversificado, boa_localizacao e gestora_confiavel
      operationId: obterCriteriosFundo
      parameters:
      - name: ticker
        in: path
        required: true
        schema:
          type: string
        example: GGRC11
      responses:
        '200':
          description: Cada criterio com o valor apurado e o limite
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Resposta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/FundoCriterios'
        '404':
          description: Ticker nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
  /fundos/{ticker}/taxas:
    get:
      summary: Calculo da taxa de administracao, trimestre a trimestre
      operationId: obterTaxasFundo
      parameters:
      - name: ticker
        in: path
        required: true
        schema:
          type: string
        example: GGRC11
      responses:
        '200':
          description: Taxa anual e o detalhe de cada trimestre usado
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Resposta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/FundoTaxas'
        '404':
          description: Ticker nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
  /fundos/{ticker}:
    get:
      summary: Detalhe de um fundo
      operationId: obterFundo
      parameters:
      - name: ticker
        in: path
        required: true
        schema:
          type: string
        example: GGRC11
      responses:
        '200':
          description: Fundo encontrado
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Resposta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Fundo'
        '404':
          description: Ticker nao encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '422':
          description: O fundo e de um segmento fora do contrato (Fiagro, FI-Infra...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '502':
          description: O statusinvest nao respondeu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
components:
  schemas:
    Resposta:
      type: object
      description: Envelope padrao das respostas da API
      properties:
        status:
          type: integer
          description: Mesmo valor do status HTTP
        data: {}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Erro'
      required:
      - status
      - errors
    RespostaErro:
      allOf:
      - $ref: '#/components/schemas/Resposta'
      - type: object
        properties:
          data:
            type: object
            maxProperties: 0
    Erro:
      type: object
      properties:
        message:
          type: string
        data: {}
      required:
      - message
    FundoTaxas:
      type: object
      properties:
        ticker:
          type: string
        cnpj:
          anyOf:
          - type: string
          - type: 'null'
        taxa_administracao:
          anyOf:
          - type: number
          - type: 'null'
          description: '% ao ano, media dos trimestres anualizados'
        trimestres:
          type: array
          description: Ultimos 4 trimestres com taxa informada, do mais antigo ao mais recente
          items:
            type: object
            properties:
              trimestre:
                type: string
                format: date
                description: Ultimo dia do trimestre
              taxa_paga:
                type: number
                description: Despesa com taxa de administracao no trimestre (R$), do informe trimestral da CVM
              patrimonio_medio:
                type: number
                description: Media do PL nos meses do trimestre (R$), do informe mensal da CVM
              percentual_anualizado:
                type: number
                description: taxa_paga / patrimonio_medio * 4 * 100
    Criterio:
      type: object
      properties:
        criterio:
          type: string
          description: quantidade_imoveis, maior_participacao_imovel, estados, quantidade_cri, maior_cri_sobre_pl, quantidade_fii ou maior_fii_sobre_pl
        valor:
          anyOf:
          - type: number
          - type: 'null'
          description: Valor apurado (participacoes em %)
        limite:
          type: number
        tipo:
          type: string
          enum: [minimo, maximo]
        ok:
          anyOf:
          - type: boolean
          - type: 'null'
          description: null quando falta dado para avaliar
        base:
          type: string
          description: So em maior_participacao_imovel; receita ou area (sem receita informada)
    FundoCriterios:
      type: object
      properties:
        ticker:
          type: string
        cnpj:
          anyOf:
          - type: string
          - type: 'null'
        segmento:
          $ref: '#/components/schemas/Segmento'
        diversificacao:
          type: object
          properties:
            diversificado:
              anyOf:
              - type: boolean
              - type: 'null'
            classe:
              anyOf:
              - type: string
                enum: [imoveis, cri, fii]
              - type: 'null'
              description: Tijolo = imoveis, Papel = cri, FoF = fii; Hibrido = classe com mais dinheiro no informe mensal
            data:
              anyOf:
              - type: string
                format: date
              - type: 'null'
              description: Data do informe usado
            criterios:
              type: array
              items:
                $ref: '#/components/schemas/Criterio'
        localizacao:
          type: object
          properties:
            boa_localizacao:
              anyOf:
              - type: boolean
              - type: 'null'
            percentual_area_boa:
              anyOf:
              - type: number
              - type: 'null'
              description: Area em cidades boas / area com cidade classificada (%)
            percentual_area_classificada:
              anyOf:
              - type: number
              - type: 'null'
              description: Area com cidade classificada / area total (%)
            imoveis:
              type: array
              items:
                type: object
                properties:
                  nome:
                    type: string
                  cidade:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: Municipio/UF identificado no endereco; null se nao achou
                  area:
                    type: number
                  boa:
                    anyOf:
                    - type: boolean
                    - type: 'null'
        gestora:
          type: object
          properties:
            nome:
              anyOf:
              - type: string
              - type: 'null'
            cnpj:
              anyOf:
              - type: string
              - type: 'null'
            confiavel:
              anyOf:
              - type: boolean
              - type: 'null'
    Regiao:
      type: object
      properties:
        tipo:
          type: string
        cidade:
          type: string
        uf:
          type: string
        municipioId:
          type: integer
          description: Codigo IBGE do municipio
        imoveis:
          type: integer
          description: Imoveis de renda prontos de FII na cidade (no tipo; em vacancia_cidade, todos os tipos)
        fundos:
          type: integer
        vacanciaMedia:
          anyOf:
          - type: number
          - type: 'null'
          description: '%; null na fonte ibge'
        vacanciaMercado:
          anyOf:
          - type: number
          - type: 'null'
          description: '%; media do mercado usada na comparacao'
        boa:
          type: boolean
        fonte:
          type: string
          enum: [vacancia_tipo, vacancia_cidade, ibge]
    Gestora:
      type: object
      properties:
        cnpj:
          type: string
          description: So digitos
        nome:
          type: string
        fundos:
          type: integer
          description: Quantidade de FIIs geridos
        confiavel:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Esta em data/gestoras-confiaveis.json; null com a lista vazia
    Fundo:
      additionalProperties: false
      description: Um fundo imobiliario, normalizado, pronto para o pipeline consumir.
      properties:
        ticker:
          description: 'Codigo de negociacao, ex: GGRC11'
          title: Ticker
          type: string
        nome:
          title: Nome
          type: string
        gestora:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Nome da gestora, do informe anual da CVM
          title: Gestora
        segmento:
          $ref: '#/components/schemas/Segmento'
        subsegmento:
          title: Subsegmento
          type: string
        descricao:
          default: ''
          description: Texto curto usado no calculo de similaridade entre pares
          title: Descricao
          type: string
        cotacao:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Cotacao
        valor_patrimonial_cota:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Valor Patrimonial Cota
        dividend_yield_12m:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: '% ao ano, ultimos 12 meses'
          title: Dividend Yield 12M
        dividendos_mensais:
          description: Ultimos meses, mais antigo primeiro
          items:
            type: number
          title: Dividendos Mensais
          type: array
        taxa_administracao:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          description: '% ao ano. Despesa com taxa de administracao (administracao + gestao) dos ultimos 4 trimestres sobre o PL medio, dos informes da CVM. Ver /fundos/{ticker}/taxas'
          title: Taxa Administracao
        vacancia_fisica:
          anyOf:
          - maximum: 100
            minimum: 0
            type: number
          - type: 'null'
          default: null
          description: '% da ABL vaga, media dos imoveis ponderada pela area'
          title: Vacancia Fisica
        liquidez_diaria:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          description: R$ negociados/dia, media
          title: Liquidez Diaria
        num_imoveis:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Num Imoveis
        diversificado:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: 'Tijolo: >= 5 imoveis, nenhum com mais de 30% da receita (ou da area, sem receita informada) e imoveis em >= 2 estados. Papel: >= 10 CRIs e nenhum com mais de 15% do PL. FoF: >= 10 FIIs e nenhum com mais de 20% do PL. Hibrido: regra da classe com mais dinheiro. Informes da CVM; null quando falta dado. Ver /fundos/{ticker}/criterios'
          title: Diversificado
        gestora_confiavel:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: CNPJ da gestora (informe anual da CVM) esta em data/gestoras-confiaveis.json. null sem gestora ou com a lista vazia. Ver /gestoras
          title: Gestora Confiavel
        boa_localizacao:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: 'So Tijolo e Hibrido. >= 60% da area em cidades boas (ver /fundos/regioes); null se menos de 50% da area tiver cidade identificada. Ver /fundos/{ticker}/criterios'
          title: Boa Localizacao
        limite_distribuicao_respeitado:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Rendimentos declarados >= 95% do resultado financeiro do ultimo semestre (informe trimestral da CVM). Sem resultado positivo, true
          title: Limite Distribuicao Respeitado
        dividendo_extraordinario_ultimo_ano:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Algum rendimento dos ultimos 12 meses acima de 1,5x a mediana do periodo. null com menos de 3 rendimentos
          title: Dividendo Extraordinario Ultimo Ano
        ltv_medio:
          anyOf:
          - maximum: 100
            minimum: 0
            type: number
          - type: 'null'
          default: null
          description: LTV medio da carteira de CRIs (%), lido do relatorio gerencial mais recente no FNET ("LTV medio" ou "LTV consolidado"). So para Papel e Hibrido; null quando o relatorio nao informa a media
          title: Ltv Medio
        spread_credito:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 'Spread de credito medio da carteira sobre o titulo publico, em % ao ano (ex.: "1,48%"), lido do relatorio gerencial mais recente no FNET ("spread medio", "spread ponderado" ou "spread de credito", em % ou bps). So para Papel e Hibrido; null quando o relatorio nao informa a media ou so traz a taxa com indexador (IPCA + X%)'
          title: Spread Credito
        administradora:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Extra. Nome da administradora do fundo
          title: Administradora
        gestora_cnpj:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Extra. CNPJ da gestora, so digitos, do informe anual da CVM
          title: Gestora CNPJ
        percentual_distribuido:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          description: Extra. Rendimentos declarados / resultado financeiro do ultimo semestre (%). Acima de 100 indica distribuicao maior que o resultado gerado
          title: Percentual Distribuido
        alavancagem:
          anyOf:
          - minimum: 0
            type: number
          - type: 'null'
          default: null
          description: Extra. (Obrigacoes por securitizacao de recebiveis + obrigacoes por aquisicao de imoveis) / ativo total (%), do informe mensal mais recente da CVM
          title: Alavancagem
        ltv_referencia:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Extra. Data de referencia (dd/mm/aaaa) do relatorio gerencial de onde saiu o ltv_medio
          title: LTV Referencia
        cnpj:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Extra. CNPJ do fundo, so digitos
          title: CNPJ
        tipo_gestao:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Extra. Tipo de gestao (Ativa, Passiva)
          title: Tipo Gestao
        p_vp:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          default: null
          description: Extra. Cotacao / valor patrimonial por cota
          title: P/VP
        dividend_yield_1m:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: Extra. % do ultimo rendimento sobre a cotacao
          title: Dividend Yield 1M
        ultimo_rendimento:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          default: null
          description: Extra. Ultimo rendimento pago, R$ por cota
          title: Ultimo Rendimento
        dividend_cagr_3a:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: Extra. % de crescimento anual composto dos dividendos em 3 anos
          title: Dividend CAGR 3A
        cota_cagr_3a:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: Extra. % de crescimento anual composto da cota em 3 anos
          title: Cota CAGR 3A
        percentual_caixa:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: Extra. % do patrimonio em caixa
          title: Percentual Caixa
        numero_cotistas:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          default: null
          description: Extra. Quantidade de cotistas
          title: Numero Cotistas
        cotas_emitidas:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          default: null
          description: Extra. Quantidade de cotas
          title: Cotas Emitidas
        patrimonio_liquido:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: Extra. R$
          title: Patrimonio Liquido
        valor_mercado:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          default: null
          description: Extra. Cotacao * cotas emitidas, R$
          title: Valor Mercado
        area_total:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          default: null
          description: Extra. Area somada dos imoveis, em m2
          title: Area Total
      required:
      - ticker
      - nome
      - segmento
      - subsegmento
      title: FundoFII
      type: object
    Segmento:
      enum:
      - Tijolo
      - Papel
      - Híbrido
      - FoF
      title: Segmento
      type: string
